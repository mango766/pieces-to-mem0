[project]
name = "memory-janitor"
version = "0.1.0"
description = "Personal Memory Consolidation Agent - Async agent connecting Pieces OS to Mem0"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Memory Janitor Team" }]
keywords = ["memory", "agent", "langgraph", "pieces", "mem0"]

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-anthropic>=0.2.0",
    "pieces_os_client>=5.0.0",
    "mem0ai>=1.0.0",
    "gradio>=4.0.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
memory-janitor = "memory_janitor.main:main"
mj-dashboard = "memory_janitor.dashboard:launch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_janitor"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
